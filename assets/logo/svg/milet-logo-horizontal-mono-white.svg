<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
    .milet-wm {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    .milet-tag {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.32em;
    }
  </style>
</defs>
  <!-- Símbolo à esquerda -->
  <g transform="translate(10, 10) scale(0.4)">
    <path fill-rule="evenodd" fill="#F7F3EA" d="M 245 46
  C 292 46, 388 102, 436 192
  C 476 268, 466 345, 416 410
  C 376 450, 290 458, 204 450
  C 128 442, 64 388, 58 322
  C 52 242, 108 132, 174 78
  C 204 53, 224 46, 245 46 Z

  M 235 142
  C 198 142, 158 212, 153 272
  C 148 328, 184 362, 234 362
  C 284 362, 318 322, 323 262
  C 328 198, 278 142, 235 142 Z"/>
  </g>

  <!-- Wordmark 'Milet' -->
  <text x="240" y="132" class="milet-wm" font-size="94" fill="#F7F3EA">Milet</text>

  <!-- Divisor Vertical -->
  <line x1="530" y1="58" x2="530" y2="150" stroke="#F7F3EA" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Tagline Multi-linha à direita -->
  <text x="560" y="92" class="milet-tag" font-size="13" fill="#F7F3EA">ENERGIA</text>
  <text x="560" y="114" class="milet-tag" font-size="13" fill="#F7F3EA">EM MAIS</text>
  <text x="560" y="136" class="milet-tag" font-size="13" fill="#F7F3EA">LIBERDADE</text>
</svg>