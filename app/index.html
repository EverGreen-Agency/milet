<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Milet">
  <meta name="description" content="Demonstração Milet: da fatura a cenários de energia comparáveis.">
  <title>Milet · Decisão energética</title>
  <link rel="icon" type="image/png" href="../assets/logo/png/solid/favicon-light-32x32.png">
  <link rel="apple-touch-icon" href="../assets/logo/png/solid/milet-app-icon-180x180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Milet, página inicial">
      <img src="../assets/logo/png/transparent/milet-symbol-amber.png" alt="Milet">
      <span>Milet</span>
    </a>
    <div class="header-meta">
      <button class="install-button" id="install-app" type="button" hidden>Instalar</button>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Alternar tema" aria-pressed="false">◐</button>
    </div>
  </header>
  <div class="runtime-status" id="runtime-status" data-mode="loading" role="status">Inicializando diagnóstico…</div>

  <div class="app-shell">
    <aside class="journey" aria-label="Progresso da análise">
      <p class="eyebrow">Diagnóstico Energético</p>
      <strong id="unit-name">Padaria Horizonte</strong>
      <span class="case-id" id="unit-id">UC-MG-00482</span>
      <ol id="stepper"></ol>
      <div class="privacy-note">
        <strong>Privacidade &amp; Sigilo</strong>
        <span>Dados protegidos conforme a LGPD e utilizados exclusivamente para comparação neutra.</span>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <div id="live-region" class="sr-only" aria-live="polite"></div>
      <div id="screen"></div>
    </main>
  </div>

  <noscript>Esta demonstração precisa de JavaScript para navegar entre as etapas.</noscript>
  <script src="runtime-config.js"></script>
  <script type="module" src="src/pwa.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
